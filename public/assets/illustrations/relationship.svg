<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="relTitle">
  <title id="relTitle">人际关系插画：树下三人，各有距离</title>
  <defs>
    <linearGradient id="relGround" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F1EDE1"/>
      <stop offset="1" stop-color="#F7F5EF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="420" height="300" fill="url(#relGround)"/>
  <circle cx="86" cy="66" r="26" fill="#A64B3C" opacity="0.12"/>

  <!-- 树 -->
  <g stroke="#4B4840" fill="none" stroke-linecap="round">
    <path d="M252 228c2-52 4-92 10-126" stroke-width="4.4"/>
    <path d="M260 128c-16-8-26-20-30-36m30 36c16-10 24-22 26-38m-26 44c-18-4-30-14-36-28m36 26c18-6 28-18 32-34" stroke-width="2"/>
    <path d="M262 168c-14-4-22-12-26-24m26 26c14-6 22-16 24-30" stroke-width="1.6" opacity="0.8"/>
  </g>
  <g fill="#4B4840" opacity="0.28">
    <ellipse cx="228" cy="96" rx="26" ry="12"/>
    <ellipse cx="292" cy="88" rx="24" ry="11"/>
    <ellipse cx="262" cy="74" rx="30" ry="13"/>
    <ellipse cx="216" cy="126" rx="18" ry="8"/>
  </g>

  <!-- 三个人，距离不同 -->
  <g stroke="#33312B" stroke-width="2" fill="none" stroke-linecap="round">
    <g>
      <circle cx="116" cy="168" r="10" fill="#33312B" stroke="none"/>
      <path d="M116 178c-7 12-8 24-5 36l-4 16m9-52c7 12 9 24 6 36l6 16"/>
      <path d="M113 192c-9 3-14 8-16 15m22-15c8 4 12 9 14 16"/>
    </g>
    <g>
      <circle cx="176" cy="182" r="10" fill="#33312B" stroke="none"/>
      <path d="M176 192c-6 11-7 21-4 32l-4 14m8-46c6 11 8 21 5 32l6 14"/>
      <path d="M173 204c-8 3-12 7-14 13m20-13c7 3 11 8 13 14"/>
    </g>
    <g>
      <circle cx="332" cy="190" r="9" fill="#33312B" stroke="none"/>
      <path d="M332 199c-6 10-7 19-4 28l-4 13m8-41c6 10 7 19 4 28l5 13"/>
      <path d="M329 210c-7 2-11 6-12 12m18-12c6 3 10 7 11 12"/>
    </g>
  </g>

  <!-- 关系连线：粗细代表距离 -->
  <g fill="none" stroke="#B69A69" stroke-linecap="round">
    <path d="M130 200c14 4 24 8 34 12" stroke-width="1.4" stroke-dasharray="4 5"/>
    <path d="M196 220c40 8 92 6 122-10" stroke-width="1" stroke-dasharray="2 7" opacity="0.7"/>
  </g>

  <path d="M24 258h372" stroke="#D8D2C4" stroke-width="1"/>
  <g fill="#4B4840" opacity="0.2">
    <circle cx="60" cy="238" r="1.4"/>
    <circle cx="300" cy="250" r="1.2"/>
    <circle cx="386" cy="232" r="1.8"/>
  </g>
</svg>