  <path d="M64 246h296" stroke="#D8D2C4" stroke-width="1"/>
  <g fill="#4B4840" opacity="0.18">
    <circle cx="86" cy="160" r="1.6"/>
    <circle cx="366" cy="180" r="1.2"/>
