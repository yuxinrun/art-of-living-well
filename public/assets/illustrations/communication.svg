<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 300" role="img" aria-labelledby="commTitle">
  <title id="commTitle">沟通表达插画：两人对坐，把话说明白</title>
  <defs>
    <linearGradient id="commWash" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#EFE8D8"/>
      <stop offset="1" stop-color="#F7F5EF" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect width="420" height="300" fill="url(#commWash)" opacity="0.7"/>
  <circle cx="332" cy="72" r="30" fill="#A64B3C" opacity="0.14"/>

  <!-- 远山 -->
  <path d="M0 232c52-40 88-58 128-58 34 0 50 18 78 20 34 2 52-20 84-20 42 0 82 26 130 58v68H0Z" fill="#8E897A" opacity="0.16"/>

  <!-- 对坐的两个人 -->
  <g stroke="#33312B" stroke-width="2" fill="none" stroke-linecap="round">
    <circle cx="126" cy="118" r="12" fill="#33312B" stroke="none"/>
    <path d="M126 130c-8 14-9 28-6 42l-6 34m12-76c9 13 11 27 8 42l8 34"/>
    <path d="M122 148c-12 4-18 10-21 20m27-20c10 5 15 12 17 22"/>
    <circle cx="290" cy="124" r="12" fill="#33312B" stroke="none"/>
    <path d="M290 136c-9 14-10 28-7 42l-6 32m13-74c9 13 11 27 8 42l8 32"/>
    <path d="M286 154c-11 5-16 11-19 20m25-20c11 5 16 12 18 22"/>
  </g>

  <!-- 对话气泡（方角，克制） -->
  <g fill="#FBF9F4" stroke="#B69A69" stroke-width="1.2">
    <path d="M74 48h118v44H104l-14 14v-14H74Z"/>
    <path d="M248 60h108v40h-30l-12 12v-12h-66Z" opacity="0.8"/>
  </g>
  <g stroke="#8B8578" stroke-width="1.6" stroke-linecap="round">
    <path d="M92 66h82M92 78h58"/>
    <path d="M262 76h78M262 87h50"/>
  </g>

  <!-- 中间的小几与茶 -->
  <g stroke="#4B4840" stroke-width="1.6" fill="none">
    <path d="M186 214h48v6h-48z"/>
    <path d="M192 220v18m36-18v18"/>
    <path d="M200 202h16v10h-16z"/>
    <path d="M216 205c6 0 6 6 0 6"/>
  </g>
  <path d="M204 196c-3-5 3-7 0-12m8 12c-3-5 3-7 0-12" stroke="#8E897A" stroke-width="1.2" fill="none" stroke-linecap="round"/>

  <!-- 地面 -->
  <path d="M40 258h340" stroke="#D8D2C4" stroke-width="1"/>
  <g fill="#4B4840" opacity="0.2">
    <circle cx="70" cy="240" r="1.4"/>
    <circle cx="352" cy="238" r="1.8"/>
    <circle cx="176" cy="248" r="1"/>
  </g>
</svg>